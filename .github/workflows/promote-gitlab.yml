name: Promote tested Manjula image to GitLab

on:
  workflow_dispatch:
    inputs:
      source_tag:
        description: Exact GHCR staging tag that passed regression/UAT (must be sha-xxxxxxx)
        required: true

permissions:
  contents: read
  packages: read

env:
  GHCR_IMAGE: ghcr.io/whizyoga-ai/manjula
  GITLAB_IMAGE: registry.gitlab.com/kai-production/hosted-customers/manjula/website-release

jobs:
  promote:
    name: Promote exact tested image
    runs-on: [self-hosted, Linux, X64, staging, regression, yoga-5090]

    steps:
      - name: Validate and resolve immutable release
        id: vars
        shell: bash
        env:
          SOURCE_TAG: ${{ inputs.source_tag }}
        run: |
          set -euo pipefail
          if ! [[ "$SOURCE_TAG" =~ ^sha-[0-9a-f]{7,40}$ ]]; then
            echo "::error::source_tag must be an immutable sha-* staging tag, for example sha-20c753e"
            exit 1
          fi
          SOURCE_SHA="${SOURCE_TAG#sha-}"
          RELEASE_TAG="release-${SOURCE_SHA}"
          echo "source_tag=${SOURCE_TAG}" >> "$GITHUB_OUTPUT"
          echo "source_sha=${SOURCE_SHA}" >> "$GITHUB_OUTPUT"
          echo "release_tag=${RELEASE_TAG}" >> "$GITHUB_OUTPUT"
          echo "Resolved immutable release: ${RELEASE_TAG}"

      - name: Login to GHCR
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' '${{ secrets.GITHUB_TOKEN }}' | docker login ghcr.io -u '${{ github.actor }}' --password-stdin

      - name: Login to GitLab registry
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' '${{ secrets.GITLAB_KAI_PROD_TOKEN_BRAHMANDO }}' | docker login registry.gitlab.com -u '${{ secrets.GITLAB_USERNAME }}' --password-stdin

      - name: Pull exact tested source image
        id: source
        shell: bash
        env:
          SOURCE_TAG: ${{ steps.vars.outputs.source_tag }}
        run: |
          set -euo pipefail
          SOURCE="${GHCR_IMAGE}:${SOURCE_TAG}"
          docker pull --platform linux/amd64 "$SOURCE"
          SOURCE_ID="$(docker image inspect "$SOURCE" --format '{{.Id}}')"
          SOURCE_REPODIGEST="$(docker image inspect "$SOURCE" --format '{{index .RepoDigests 0}}')"
          SOURCE_MANIFEST_DIGEST="${SOURCE_REPODIGEST##*@}"
          test -n "$SOURCE_ID"
          test -n "$SOURCE_MANIFEST_DIGEST"
          echo "source=${SOURCE}" >> "$GITHUB_OUTPUT"
          echo "source_id=${SOURCE_ID}" >> "$GITHUB_OUTPUT"
          echo "source_manifest_digest=${SOURCE_MANIFEST_DIGEST}" >> "$GITHUB_OUTPUT"

      - name: Resolve promotion state
        id: state
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.vars.outputs.release_tag }}
          SOURCE_DIGEST: ${{ steps.source.outputs.source_manifest_digest }}
        run: |
          set -euo pipefail
          DEST="${GITLAB_IMAGE}:${RELEASE_TAG}"
          EXISTING="$(docker buildx imagetools inspect "$DEST"             --format '{{json .Manifest.Digest}}' 2>/dev/null | tr -d '"' || true)"

          if [ -z "$EXISTING" ]; then
            echo "already=false" >> "$GITHUB_OUTPUT"
            echo "No release tag yet; it will be created."
          elif [ "$EXISTING" = "$SOURCE_DIGEST" ]; then
            # Re-running promotion for a release that already carries the exact
            # same manifest is not an overwrite, and the handoff below must stay
            # reachable for a release promoted on an earlier run.
            echo "already=true" >> "$GITHUB_OUTPUT"
            echo "existing_digest=${EXISTING}" >> "$GITHUB_OUTPUT"
            echo "Already promoted with an identical manifest; nothing to push."
          else
            echo "::error::${DEST} already exists with a different digest (${EXISTING} != ${SOURCE_DIGEST}). Refusing to overwrite an immutable release."
            exit 1
          fi

      - name: Promote without rebuilding
        id: promote
        if: steps.state.outputs.already != 'true'
        shell: bash
        env:
          SOURCE_TAG: ${{ steps.vars.outputs.source_tag }}
          RELEASE_TAG: ${{ steps.vars.outputs.release_tag }}
        run: |
          set -euo pipefail
          SOURCE="${GHCR_IMAGE}:${SOURCE_TAG}"
          DEST="${GITLAB_IMAGE}:${RELEASE_TAG}"
          APPROVED="${GITLAB_IMAGE}:approved-latest"

          docker tag "$SOURCE" "$DEST"
          docker push "$DEST"

          docker tag "$SOURCE" "$APPROVED"
          docker push "$APPROVED"

          docker pull "$DEST"
          DEST_ID="$(docker image inspect "$DEST" --format '{{.Id}}')"
          DEST_REPODIGEST="$(docker image inspect "$DEST" --format '{{index .RepoDigests 0}}')"
          DEST_MANIFEST_DIGEST="${DEST_REPODIGEST##*@}"

          echo "dest=${DEST}" >> "$GITHUB_OUTPUT"
          echo "approved=${APPROVED}" >> "$GITHUB_OUTPUT"
          echo "dest_id=${DEST_ID}" >> "$GITHUB_OUTPUT"
          echo "dest_manifest_digest=${DEST_MANIFEST_DIGEST}" >> "$GITHUB_OUTPUT"
          echo "immutable_ref=${GITLAB_IMAGE}@${DEST_MANIFEST_DIGEST}" >> "$GITHUB_OUTPUT"

      - name: Verify artifact identity
        id: released
        shell: bash
        env:
          ALREADY: ${{ steps.state.outputs.already }}
          SOURCE_DIGEST: ${{ steps.source.outputs.source_manifest_digest }}
        run: |
          set -euo pipefail
          if [ "$ALREADY" = 'true' ]; then
            DIGEST='${{ steps.state.outputs.existing_digest }}'
          else
            test '${{ steps.source.outputs.source_id }}' = '${{ steps.promote.outputs.dest_id }}'
            DIGEST='${{ steps.promote.outputs.dest_manifest_digest }}'
          fi
          test -n "$DIGEST"
          test "$SOURCE_DIGEST" = "$DIGEST"
          echo "digest=${DIGEST}" >> "$GITHUB_OUTPUT"
          echo 'Verified: GitLab image is byte-identical to the tested GHCR linux/amd64 image manifest.'

      - name: Hand off the release to GitLab release control
        id: handoff
        shell: bash
        env:
          GITLAB_API: https://gitlab.com/api/v4
          PROJECT_PATH: kai-production/hosted-customers/manjula/website-release
          GITLAB_TOKEN: ${{ secrets.GITLAB_KAI_PROD_TOKEN_BRAHMANDO }}
          RELEASE_TAG: ${{ steps.vars.outputs.release_tag }}
          RELEASE_DIGEST: ${{ steps.released.outputs.digest }}
          SOURCE_SHA: ${{ github.sha }}
          ACTOR: ${{ github.actor }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail

          # The artifact is already in the GitLab registry at this point. This
          # step is the handoff: it tells the release/control layer which
          # immutable manifest was approved, so nobody has to retype a tag.
          # The token is only ever an HTTP header - it is never echoed, never
          # written to a file, and never passed to anything but curl.
          ENC="${PROJECT_PATH//\//%2F}"
          export RELEASE_IMAGE="${GITLAB_IMAGE}:${RELEASE_TAG}"
          export IMMUTABLE_REF="${GITLAB_IMAGE}@${RELEASE_DIGEST}"

          code="$(curl -sS -o /tmp/gl_project.json -w '%{http_code}' \
                    -H "PRIVATE-TOKEN: ${GITLAB_TOKEN}" \
                    "${GITLAB_API}/projects/${ENC}" || echo 000)"
          case "$code" in
            200) : ;;
            401|403)
              echo "::error::GitLab answered HTTP ${code} on the API. The registry push in this same run worked, so the credential is valid but carries no 'api' scope - a deploy token can push images and cannot create pipelines. Grant the release credential 'api' scope, or start the deployment from GitLab."
              exit 1 ;;
            404)
              echo "::error::GitLab answered 404 for ${PROJECT_PATH}. Either that path is wrong or this credential cannot see the project."
              exit 1 ;;
            *)
              echo "::error::Unexpected HTTP ${code} resolving the GitLab project."
              cat /tmp/gl_project.json 2>/dev/null || true
              exit 1 ;;
          esac

          export PROJECT_ID="$(python3 -c 'import json;print(json.load(open("/tmp/gl_project.json"))["id"])')"
          export DEFAULT_BRANCH="$(python3 -c 'import json;d=json.load(open("/tmp/gl_project.json"));print(d.get("default_branch") or "main")')"
          echo "GitLab project ${PROJECT_PATH} resolved to id ${PROJECT_ID}, default branch ${DEFAULT_BRANCH}."

          # Machine-readable release identity. GitLab consumes these instead of
          # a human editing a release value by hand.
          python3 -c '
          import json, os
          keys = ["MANJULA_RELEASE_TAG", "MANJULA_RELEASE_DIGEST", "MANJULA_RELEASE_IMAGE",
                  "MANJULA_IMMUTABLE_REF", "MANJULA_SOURCE_SHA", "MANJULA_SOURCE_REPO",
                  "MANJULA_APPROVED_BY", "MANJULA_UAT_URL", "MANJULA_PROMOTION_RUN"]
          vals = [os.environ["RELEASE_TAG"], os.environ["RELEASE_DIGEST"], os.environ["RELEASE_IMAGE"],
                  os.environ["IMMUTABLE_REF"], os.environ["SOURCE_SHA"], "whizyoga-ai/manjula",
                  os.environ["ACTOR"], "https://staging.manjulab.com", os.environ["RUN_URL"]]
          body = {"ref": os.environ["DEFAULT_BRANCH"],
                  "variables": [{"key": k, "value": v} for k, v in zip(keys, vals)]}
          json.dump(body, open("/tmp/gl_pipeline_req.json", "w"))
          '

          # Diagnostics only - an access level, not a credential.
          ACCESS="$(python3 -c 'import json;d=(json.load(open("/tmp/gl_project.json")).get("permissions") or {});lv=[(d.get(k) or {}).get("access_level") for k in ("project_access","group_access")];print(max([x for x in lv if x] or [0]))')"
          echo "Effective access level for the release credential: ${ACCESS} (30 = Developer, 40 = Maintainer)."

          post_pipeline() {
            curl -sS -o /tmp/gl_pipeline.json -w '%{http_code}' -X POST \
              -H "PRIVATE-TOKEN: ${GITLAB_TOKEN}" \
              -H 'Content-Type: application/json' \
              --data @"$1" \
              "${GITLAB_API}/projects/${PROJECT_ID}/pipeline" || echo 000
          }

          HANDOFF_MODE='explicit release variables'
          code="$(post_pipeline /tmp/gl_pipeline_req.json)"

          # Setting pipeline variables over the API needs Maintainer. A
          # Developer-level release credential can still open the pipeline, and
          # approved-latest - which this same run has just verified points at
          # the approved manifest - still carries the release. Prefer the
          # explicit digest, fall back to the pointer, never to a rebuild.
          if [ "$code" != "201" ] && grep -q 'Insufficient permissions to set pipeline variables' /tmp/gl_pipeline.json 2>/dev/null; then
            echo "::warning::The release credential (access level ${ACCESS}) may open pipelines but not set pipeline variables; GitLab requires Maintainer (40) for that. Falling back to a plain pipeline, where GitLab resolves the release from approved-latest. Raise the credential to Maintainer to hand off the explicit digest instead."
            python3 -c 'import json,os;json.dump({"ref":os.environ["DEFAULT_BRANCH"]},open("/tmp/gl_pipeline_plain.json","w"))'
            HANDOFF_MODE="approved-latest pointer (credential lacks variable permission)"
            code="$(post_pipeline /tmp/gl_pipeline_plain.json)"
          fi

          echo "handoff_mode=${HANDOFF_MODE}" >> "$GITHUB_OUTPUT"

          if [ "$code" = "201" ]; then
            URL="$(python3 -c 'import json;print(json.load(open("/tmp/gl_pipeline.json")).get("web_url",""))')"
            ID="$(python3 -c 'import json;print(json.load(open("/tmp/gl_pipeline.json")).get("id",""))')"
            echo "pipeline_url=${URL}" >> "$GITHUB_OUTPUT"
            echo "pipeline_id=${ID}" >> "$GITHUB_OUTPUT"
            echo "Handed off to GitLab pipeline ${ID}: ${URL}"
            echo "Handoff carried: ${HANDOFF_MODE}"
            echo "Production deployment stays manual there, as intended."
          else
            echo "::error::GitLab refused to create the pipeline (HTTP ${code}). Response follows; it contains no credential."
            cat /tmp/gl_pipeline.json 2>/dev/null || true
            exit 1
          fi

      - name: Publish release metadata
        shell: bash
        run: |
          {
            echo '## Manjula production promotion'
            echo ''
            echo '- Source: `${{ steps.source.outputs.source }}`'
            echo '- Immutable release tag: `${{ steps.vars.outputs.release_tag }}`'
            echo '- Destination: `${{ steps.promote.outputs.dest }}`'
            echo '- Convenience alias: `${{ steps.promote.outputs.approved }}`'
            echo '- Immutable deploy ref: `${{ steps.promote.outputs.immutable_ref }}`'
            echo '- Image ID: `${{ steps.promote.outputs.dest_id }}`'
            echo '- Manifest digest: `${{ steps.promote.outputs.dest_manifest_digest }}`'
            echo '- Promotion mode: **no rebuild**'
            echo '- Regression/UAT source: `staging.manjulab.com`'
            echo '- GitLab handoff pipeline: ${{ steps.handoff.outputs.pipeline_url }}'
            echo '- GitLab handoff mode: ${{ steps.handoff.outputs.handoff_mode }}'
            echo '- Production deployment: **manual in GitLab**'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Cleanup registry sessions
        if: always()
        shell: bash
        run: |
          docker logout ghcr.io >/dev/null 2>&1 || true
          docker logout registry.gitlab.com >/dev/null 2>&1 || true
