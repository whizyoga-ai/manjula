name: Promote tested Manjula image to GitLab

on:
  workflow_dispatch:
    inputs:
      source_tag:
        description: Exact GHCR staging tag that passed regression/UAT (must be sha-xxxxxxx)
        required: true

permissions:
  contents: read
  packages: read

env:
  GHCR_IMAGE: ghcr.io/whizyoga-ai/manjula
  GITLAB_IMAGE: registry.gitlab.com/kai-production/hosted-customers/manjula/website-release

jobs:
  promote:
    name: Promote exact tested image
    runs-on: [self-hosted, Linux, X64, staging, regression, yoga-5090]

    steps:
      - name: Validate and resolve immutable release
        id: vars
        shell: bash
        env:
          SOURCE_TAG: ${{ inputs.source_tag }}
        run: |
          set -euo pipefail
          if ! [[ "$SOURCE_TAG" =~ ^sha-[0-9a-f]{7,40}$ ]]; then
            echo "::error::source_tag must be an immutable sha-* staging tag, for example sha-20c753e"
            exit 1
          fi
          SOURCE_SHA="${SOURCE_TAG#sha-}"
          RELEASE_TAG="release-${SOURCE_SHA}"
          echo "source_tag=${SOURCE_TAG}" >> "$GITHUB_OUTPUT"
          echo "source_sha=${SOURCE_SHA}" >> "$GITHUB_OUTPUT"
          echo "release_tag=${RELEASE_TAG}" >> "$GITHUB_OUTPUT"
          echo "Resolved immutable release: ${RELEASE_TAG}"

      - name: Login to GHCR
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' '${{ secrets.GITHUB_TOKEN }}' | docker login ghcr.io -u '${{ github.actor }}' --password-stdin

      - name: Login to GitLab registry
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' '${{ secrets.GITLAB_KAI_PROD_TOKEN_BRAHMANDO }}' | docker login registry.gitlab.com -u '${{ secrets.GITLAB_USERNAME }}' --password-stdin

      - name: Pull exact tested source image
        id: source
        shell: bash
        env:
          SOURCE_TAG: ${{ steps.vars.outputs.source_tag }}
        run: |
          set -euo pipefail
          SOURCE="${GHCR_IMAGE}:${SOURCE_TAG}"
          docker pull --platform linux/amd64 "$SOURCE"
          SOURCE_ID="$(docker image inspect "$SOURCE" --format '{{.Id}}')"
          SOURCE_REPODIGEST="$(docker image inspect "$SOURCE" --format '{{index .RepoDigests 0}}')"
          SOURCE_MANIFEST_DIGEST="${SOURCE_REPODIGEST##*@}"
          test -n "$SOURCE_ID"
          test -n "$SOURCE_MANIFEST_DIGEST"
          echo "source=${SOURCE}" >> "$GITHUB_OUTPUT"
          echo "source_id=${SOURCE_ID}" >> "$GITHUB_OUTPUT"
          echo "source_manifest_digest=${SOURCE_MANIFEST_DIGEST}" >> "$GITHUB_OUTPUT"

      - name: Refuse overwrite of immutable release tag
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.vars.outputs.release_tag }}
        run: |
          set -euo pipefail
          DEST="${GITLAB_IMAGE}:${RELEASE_TAG}"
          if docker manifest inspect "$DEST" >/dev/null 2>&1; then
            echo "::error::Immutable release tag already exists: ${DEST}"
            exit 1
          fi

      - name: Promote without rebuilding
        id: promote
        shell: bash
        env:
          SOURCE_TAG: ${{ steps.vars.outputs.source_tag }}
          RELEASE_TAG: ${{ steps.vars.outputs.release_tag }}
        run: |
          set -euo pipefail
          SOURCE="${GHCR_IMAGE}:${SOURCE_TAG}"
          DEST="${GITLAB_IMAGE}:${RELEASE_TAG}"
          APPROVED="${GITLAB_IMAGE}:approved-latest"

          docker tag "$SOURCE" "$DEST"
          docker push "$DEST"

          docker tag "$SOURCE" "$APPROVED"
          docker push "$APPROVED"

          docker pull "$DEST"
          DEST_ID="$(docker image inspect "$DEST" --format '{{.Id}}')"
          DEST_REPODIGEST="$(docker image inspect "$DEST" --format '{{index .RepoDigests 0}}')"
          DEST_MANIFEST_DIGEST="${DEST_REPODIGEST##*@}"

          echo "dest=${DEST}" >> "$GITHUB_OUTPUT"
          echo "approved=${APPROVED}" >> "$GITHUB_OUTPUT"
          echo "dest_id=${DEST_ID}" >> "$GITHUB_OUTPUT"
          echo "dest_manifest_digest=${DEST_MANIFEST_DIGEST}" >> "$GITHUB_OUTPUT"
          echo "immutable_ref=${GITLAB_IMAGE}@${DEST_MANIFEST_DIGEST}" >> "$GITHUB_OUTPUT"

      - name: Verify artifact identity
        shell: bash
        run: |
          set -euo pipefail
          test '${{ steps.source.outputs.source_id }}' = '${{ steps.promote.outputs.dest_id }}'
          test '${{ steps.source.outputs.source_manifest_digest }}' = '${{ steps.promote.outputs.dest_manifest_digest }}'
          echo 'Verified: GitLab image is byte-identical to the tested GHCR linux/amd64 image manifest.'

      - name: Publish release metadata
        shell: bash
        run: |
          {
            echo '## Manjula production promotion'
            echo ''
            echo '- Source: `${{ steps.source.outputs.source }}`'
            echo '- Immutable release tag: `${{ steps.vars.outputs.release_tag }}`'
            echo '- Destination: `${{ steps.promote.outputs.dest }}`'
            echo '- Convenience alias: `${{ steps.promote.outputs.approved }}`'
            echo '- Immutable deploy ref: `${{ steps.promote.outputs.immutable_ref }}`'
            echo '- Image ID: `${{ steps.promote.outputs.dest_id }}`'
            echo '- Manifest digest: `${{ steps.promote.outputs.dest_manifest_digest }}`'
            echo '- Promotion mode: **no rebuild**'
            echo '- Regression/UAT source: `staging.manjulab.com`'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Cleanup registry sessions
        if: always()
        shell: bash
        run: |
          docker logout ghcr.io >/dev/null 2>&1 || true
          docker logout registry.gitlab.com >/dev/null 2>&1 || true
